<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ MCLEOD COMMAND | 20_WEB_Gld</title>
    <!-- Tailwind for rapid deployment of UI assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FIX: Using Relative Path instead of file:/// -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex bg-[#0a0a0a] text-white h-screen w-screen overflow-hidden">

<aside class="w-64 flex flex-col border-r border-zinc-800 bg-black h-full shrink-0">
        <div class="p-6">
            <img src="assets/rj-logo.png" alt="RJ McLeod" class="h-12 w-auto object-contain mb-1">
            <p class="text-[10px] text-zinc-600 mt-1 uppercase tracking-widest font-bold">QSET REPORTING</p>
        </div>

        <!-- The Great Hall of Navigation: Populated by main.js -->
        <nav class="flex-1 mt-4 space-y-1 overflow-y-auto" id="main-nav">
            <div class="px-6 py-4 text-xs text-zinc-700 italic uppercase">Initializing...</div>
        </nav>

        <!-- Status Bar: Operational Intel -->
        <div class="p-6 border-t border-zinc-900 bg-zinc-950/50">
            <div class="text-[9px] text-zinc-600 mb-2 uppercase font-black tracking-widest">Operational Status</div>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                <span class="text-[10px] text-zinc-400 font-mono uppercase tracking-tighter">Live Data Active</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-black">
        
        <!-- Header: Contextual Intelligence -->
        <header class="h-16 flex items-center justify-between px-8 border-b border-zinc-800 bg-black/50 backdrop-blur-md z-10">
            <div class="flex flex-col">
                <h2 id="page-title" class="text-xl font-black text-white uppercase tracking-tighter italic leading-none">CONNECTING...</h2>
                <span class="text-[9px] text-[#ffcc00] uppercase font-bold tracking-widest mt-1">Metrics Overview</span>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="flex-1 flex flex-col items-end mr-4">
                    <span class="text-[9px] text-zinc-500 font-black uppercase">Authentication Context</span>
                    <span class="text-[10px] font-mono text-zinc-300">Thomas Cox</span>
                </div>
                <div class="h-8 w-[1px] bg-zinc-800"></div>
                <div class="px-3 py-1.5 bg-[#ffcc00] text-black text-[10px] font-black uppercase tracking-widest rounded shadow-lg">
                    Refresh Data
                </div>
            </div>
        </header>

        <!-- The Grid: The data-vault will manifest here -->
        <div id="grid-container" class="flex-1 p-6 overflow-hidden">
            <div class="w-full h-full flex items-center justify-center">
                <div class="text-center">
                    <div class="w-12 h-12 border-4 border-[#ffcc00] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-xs text-zinc-500 uppercase tracking-[0.2em] animate-pulse font-bold">Synchronizing Data...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- FIX: Using Relative Path instead of file:/// -->
    <script src="js/main.js"></script>
</body>
</html>
